name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vidgear_ref:
        description: "vidgear git ref (branch/tag/commit) to test themes against"
        default: "testing"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless "vidgear[asyncio] @ git+https://github.com/abhiTronix/vidgear@${{ inputs.vidgear_ref || 'testing' }}" pytest-playwright
      - name: Ensure browsers are installed
        run: python -m playwright install --with-deps chromium
      - name: Run your tests
        run: pytest tests -v --tracing=retain-on-failure
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
